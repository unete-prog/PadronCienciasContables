<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <!-- Meta etiquetas para vista previa en WhatsApp / Redes Sociales -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Padrón Electoral 2026 - ÚNETE 2.0 ICU Contables" />
  <meta property="og:description" content="Consulta tu mesa, aula de votación y si fuiste elegido como Jurado Electoral." />
  <meta property="og:image" content="logo.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="400" />
  <meta property="og:image:height" content="400" />
  <link rel="image_src" href="logo.png" />
  <link rel="icon" href="logo.png" type="image/png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Padrón Electoral 2026 - ÚNETE 2.0 ICU Contables</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f3f6f4; }
    .bg-unete { background: linear-gradient(135deg, #094723 0%, #0d6332 100%); }
    .text-unete { color: #0b592b; }
    .slide-anim { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
  </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col items-center antialiased">

  <!-- Header Banner -->
  <header class="w-full bg-unete text-white shadow-md py-4 px-4 sticky top-0 z-40">
    <div class="max-w-xl mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <img src="logo.png" alt="Logo Únete 2.0" class="w-14 h-14 rounded-full border-2 border-emerald-300 shadow-md bg-white object-cover" />
        <div>
          <div class="text-[10px] uppercase font-bold tracking-widest text-emerald-300">U.A.G.R.M. • Elecciones 2026</div>
          <h1 class="text-xl font-black tracking-tight leading-none text-white">ÚNETE 2.0 - ICU</h1>
          <p class="text-[11px] text-emerald-100 font-medium mt-0.5">Facultad de Ciencias Contables</p>
        </div>
      </div>
      <div class="text-right">
        <span class="bg-emerald-500/20 text-emerald-200 text-xs px-2.5 py-1 rounded-full font-bold border border-emerald-400/30">
          Casilla #3
        </span>
      </div>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="w-full max-w-xl px-4 py-6 space-y-6 flex-1">

    <!-- Tarjeta de Búsqueda -->
    <div class="bg-white rounded-3xl shadow-xl border border-slate-100 p-6 md:p-8">
      <div class="text-center mb-6">
        <span class="inline-flex items-center gap-1.5 bg-emerald-50 text-emerald-800 border border-emerald-200 text-xs font-bold px-3 py-1 rounded-full mb-2">
          <i class="fa-solid fa-circle-check text-emerald-600"></i> Consulta de Mesa, Aula y Jurados
        </span>
        <h2 class="text-2xl font-black text-slate-900 tracking-tight">Consulta tu Habilitación</h2>
        <p class="text-xs text-slate-500 mt-1 max-w-sm mx-auto">
          Ingresa tu número de <b>Registro Universitario</b> para consultar tu mesa de votación, aula asignada y si eres <b>Jurado Electoral</b>.
        </p>
      </div>

      <!-- Buscador -->
      <div class="space-y-3">
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-id-card text-lg"></i>
          </div>
          <input 
            type="number" 
            id="regInput" 
            inputmode="numeric"
            placeholder="Ingresa tu Registro (ej: 226059073)" 
            class="w-full pl-12 pr-4 py-3.5 bg-slate-50 border-2 border-slate-200 focus:bg-white focus:border-[#0b592b] rounded-2xl text-center text-lg font-bold tracking-wide outline-none transition duration-200"
            onkeypress="if(event.key === 'Enter') handleButtonClick()"
          />
        </div>
        <button 
          onclick="handleButtonClick()" 
          id="btnConsultar"
          data-state="consultar"
          class="w-full bg-[#0b592b] hover:bg-[#073f1f] active:scale-[0.99] text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg shadow-emerald-950/20 transition-all duration-200 flex items-center justify-center gap-2 text-base">
          <i class="fa-solid fa-magnifying-glass"></i> Consultar Ahora
        </button>
      </div>

      <!-- Contenedor de Resultado -->
      <div id="resultado" class="hidden mt-6 transition-all duration-300"></div>
    </div>
  </main>

  <script>
    // En el resultado se muestran los campos actualizados:
    // Estudiante: { n: "NOMBRE", c: "CARRERA", f: "FACULTAD", m: "MESA", a: "AULA", j: "JURADO" }
    function handleButtonClick() {
      const btn = document.getElementById('btnConsultar');
      if (btn.dataset.state === 'nueva') {
        reiniciarConsulta();
      } else {
        consultarPadron();
      }
    }

    function reiniciarConsulta() {
      const btn = document.getElementById('btnConsultar');
      const input = document.getElementById('regInput');
      const res = document.getElementById('resultado');
      input.value = '';
      res.classList.add('hidden');
      res.innerHTML = '';
      btn.dataset.state = 'consultar';
      btn.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> Consultar Ahora';
      btn.className = "w-full bg-[#0b592b] hover:bg-[#073f1f] active:scale-[0.99] text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg shadow-emerald-950/20 transition-all duration-200 flex items-center justify-center gap-2 text-base";
      input.focus();
    }
  </script>
</body>
</html>
